[mod-setting-name]
tuner-upper-byproducts=Enable byproducts on upgrading recipes
tuner-upper-nerf-quality-power=Nerf the power of quality
tuner-upper-buff-quality-science=Buff quality science
tuner-upper-extra-tiers=Extra quality tiers

[mod-setting-description]
tuner-upper-byproducts=[color=blue]Disabled[/color]: No extra byproducts from tuning up items. (Mods may override this for specific recipes if not having byproducts doesn't make sense.)\n[color=blue]Per-Recipe[/color]: Extra byproducts specified per recipe, can potentially be a variety of things.\n[color=blue]Standardised[/color]: Most tune-up station and science pack recipes output one of a few generic types of scrap that break down into a variety of resources fulgora-style.
tuner-upper-nerf-quality-power=Reduces the effects of quality for things with strong multiplicative benefits (crafting machines, modules and beacons, as well as equipment grids).\nGenerally, quality is vastly cheaper with this mod than in vanilla, and early tiers of quality are reasonably accessible to standardize on as soon as they are unlocked, rather than rare extras until you get recyclers. These combine to make quality exceptionally powerful if the baseline stats are left untouched.
tuner-upper-buff-quality-science=Tool durability (repair packs and science packs) is increased at rare+. Combined with more economical & controllable access to quality this can make caring about quality in science production very worthwhile.
tuner-upper-extra-tiers=Some extra quality tiers properly integrated into progression rather than added as postgame numbergoupslop, if you want that sort of thing. Legendary may be slightly less of an achievement in this system if played with mods that add extra steps to everything (cough cough).

[string-mod-setting]
tuner-upper-byproducts-Disabled=Disabled
tuner-upper-byproducts-Per-Recipe=Per-Recipe
tuner-upper-byproducts-Standardised=Standardised

tuner-upper-extra-tiers-Off=Off
tuner-upper-extra-tiers-+3=+3
tuner-upper-extra-tiers-+5=+5

[tips-and-tricks-item-name]
new-quality-mechanics=New quality mechanics
recyclers-and-quality=Recyclers and quality

[tips-and-tricks-item-description]
new-quality-mechanics=Quality can never increase by more than one level per process, meaning you only ever need one filter on the output. If you can get quality chance above 100% you do not need a filter at all.\n\n[entity=tune-up-station] and [entity=molecular-purifier] can upgrade the quality of items by consuming other resources. Standard rules for ingredient quality apply, so to upgrade uncommon items to rare you also need uncommon reagents, and so on.
recyclers-and-quality=[entity=recycler] has a chance to downgrade the quality of items it processes. Use quality modules to mitigate this. Recyclers can never output a higher quality item than their input.\n\nMachines other than recyclers will never decrease the quality of items they process, even if you use speed modules to give them a negative quality chance.
