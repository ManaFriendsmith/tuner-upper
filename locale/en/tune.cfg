[mod-setting-description]
tuner-upper-byproducts=Mainly intended to make recyclers no longer obsolete outside of Fulgora.
tuner-upper-nerf-quality-power=Reduces the generic effects of quality from 30% to 10% per level; halves the effect of quality on beacon transmission power; makes quality only scale equipment grids' height. Baseline quality modules are buffed to ensure the maximum quality chance with legendary QM3s is roughly the same.\nGenerally, quality is many orders of magnitude cheaper with this mod than in vanilla, and early tiers of quality are reasonably accessible to standardize on as soon as they are unlocked, rather than rare extras until you get recyclers. These combine to make quality exceptionally powerful if the baseline stats are left untouched. I also think the power ceiling of quality is just altogether too high and leads to ugly base design and resources feeling worthless, but I realize this is a contentious opinion to say the least, hence why this is an option.
tuner-upper-buff-quality-science=Tool durability (repair packs and science packs) is increased at rare+. Combined with more economical & controllable access to quality this can make caring about quality in science production very worthwhile.

